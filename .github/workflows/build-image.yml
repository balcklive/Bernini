# =============================================================================
# GitHub Actions — Build & Push Docker image to GHCR
# =============================================================================
# Triggered on:
#   - push to main (build + push with latest + short-sha tags)
#   - git tag v*        (build + push with semver + latest tags)
#   - workflow_dispatch (manual trigger)
#
# Prerequisites — repository secrets:
#   (none for GHCR; uses the built-in GITHUB_TOKEN with write:packages scope)
#
# Repository Settings required:
#   Settings → Actions → General → Workflow permissions →
#     "Read and write permissions" + "Allow GitHub Actions to create and
#      approve pull requests"
#   Settings → Actions → General → "Allow writing to packages"
#
# After first run:
#   - Package appears under your GitHub profile → Packages, OR
#   - Repository sidebar → Packages
#   - Make the package public:
#     Package page → Package settings → Change visibility → Public
# =============================================================================

name: Build & Push Docker Image to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (multi-platform / caching) ─────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to GitHub Container Registry ──────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Generate image tags and labels ──────────────────────────────
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # main branch → latest + short-sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,suffix=,format=short
            # git tag v* → semver tags (e.g. v1.0.0 → 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Bernini
            org.opencontainers.image.description=Latent Semantic Planning for Video Diffusion
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      # ── 5. Build and push ──────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache from previous builds to speed up repeated runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # For CUDA-based images, only linux/amd64 is practical
          platforms: linux/amd64
